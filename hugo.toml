baseURL = 'https://diekruecke.de/'
languageCode = 'de-DE'
title = 'DieKruecke'

enableEmoji = false
disableKinds = ["taxonomy", "term"]

enableRobotsTXT = true

umamiID = "c29fd3b6-fd32-4113-8d87-2606e7af6aea"

enableGitInfo = true
copyright = "&copy; 2026 DieKruecke | [AGB](/agb.pdf) | [Widerrufsformular](/widerrufsformular.pdf) | [Impressum](/impressum) | [Datenschutzerklärung](/datenschutz)"

# set to false
buildDrafts = true

[params]
  image = "author.jpg"
  name = "Robin Schröter"
  subtitle = "Tontechnik | Touring | Projektleitung"
  socialmedia_hinweis = "SocialMedia wird nicht aktiv genutzt"
  description = "DieKruecke – professionelle Tontechnik, Touring und Projektleitung für Events jeder Größe. Zuverlässig, erfahren und individuell – jetzt Kontakt aufnehmen!"

  # change to false
  template_hinweis = true

  enableUmami = true

  [params.services]
    [params.services.umami_analytics]
      id = 'c29fd3b6-fd32-4113-8d87-2606e7af6aea'
      script_url = 'https://umami.diekruecke.cloud/data.js'

[params.style]
  primary= "#2563eb"
  secondary= "#ea580c"

  neutral_50= "#fafafa"
  neutral_100= "#f5f5f5"
  neutral_200= "#e5e5e5"
  neutral_300= "#d4d4d4"
  neutral_400= "#a3a3a3"
  neutral_500= "#737373"
  neutral_600= "#525252"
  neutral_700= "#404040"
  neutral_800= "#262626"
  neutral_900= "#171717"
  neutral_950= "#0a0a0a"

[module]
  [module.hugoVersion]
    extended = true
    min = "0.148.1"

  [[module.imports]]
    path = "joly.pw/gohugo-shorturl"

  [[module.imports]]
    path = 'github.com/hugomods/umami-analytics'


[markup.highlight]
  noClasses = false

[markup.goldmark]
[markup.goldmark.renderer]
  unsafe = true

[frontmatter]
  lastmod = ['lastmod', ':fileModTime', ':default']